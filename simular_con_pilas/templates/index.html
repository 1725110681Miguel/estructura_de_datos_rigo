$def with (mensaje, confirmar, salio)
$ desactivado = "disabled" if salio else ""
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador con Pila</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="contenedor">
        <h1>Navegador con Pila</h1>

        <form method="post" action="/">
            <input type="text" name="url" placeholder="Escribe una página web" $desactivado>

            <div class="menu">
                <button name="accion" value="visitar" $desactivado>1. Visitar la página web</button>
                <button name="accion" value="regresar" $desactivado>2. Regresar a la página anterior</button>
                <button name="accion" value="actual" $desactivado>3. Mostrar la página actual</button>
                <button name="accion" value="historial" $desactivado>4. Mostrar el historial</button>
                <button name="accion" value="vacio" $desactivado>5. Checar o eliminar historial</button>
                <button name="accion" value="salir" class="salir" $desactivado>6. Salir del programa</button>
            </div>

            $if confirmar:
                <button name="accion" value="eliminar" class="eliminar">Sí, eliminar el historial</button>
        </form>

        <div id="salida">$mensaje</div>

        $if salio:
            <a class="reiniciar" href="/reiniciar">Iniciar de nuevo</a>
    </main>
</body>
</html>
